<meta charset="utf-8">
<title>Vocabulary 22000 암기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 대시보드는 넓은 2단(소개 + 통계) 아래에 [단어 암기]·[객관식 퀴즈] 두 줄의 3열 카드.
   학습 화면은 가운데 640px 기둥: 단계 막대 → 큰 카드(뒤에 2장이 겹쳐 보임) → 보기 버튼. */
:root {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --surface-2: #F6F7F9;
  --ink: #0F1726;
  --ink-2: #3A4456;
  --muted: #6B7487;
  --line: rgba(15, 23, 38, .09);
  --hair: rgba(0, 0, 0, .06);
  --track: #E3E7ED;
  --brand: #2F6FED;
  --brand-2: #6B98FF;
  --brand-ink: #FFFFFF;
  --brand-soft: #EAF1FE;
  --brand-line: rgba(47, 111, 237, .30);
  --again: #E2474C;
  --again-soft: #FDECEC;
  --hard: #C9820F;
  --hard-soft: #FDF3E1;
  --gold: #FFD24D;
  --puff: #DCE6FA;
  --ground: rgba(15, 23, 38, .10);
  --scrim: rgba(244, 246, 248, .74);
  --sheen: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0) 38%);
  --shadow-card: 0 1px 2px rgba(15,23,38,.04), 0 6px 14px -8px rgba(15,23,38,.08), 0 20px 40px -15px rgba(15,23,38,.10);
  --shadow-float: 0 12px 32px -12px rgba(15,23,38,.28), 0 2px 6px rgba(15,23,38,.06);
  --f-word: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --spring: cubic-bezier(.22, 1, .36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1016; --surface: #171C26; --surface-2: #1D2330; --ink: #EDF0F5; --ink-2: #C3C9D4; --muted: #8C95A7;
    --line: rgba(255,255,255,.09); --hair: rgba(255,255,255,.07); --track: #262D3A;
    --brand: #5B8CFF; --brand-2: #8AADFF; --brand-ink: #0A1122; --brand-soft: #1A2541; --brand-line: rgba(91,140,255,.40);
    --again: #FF7479; --again-soft: #3A1D22; --hard: #F0B44C; --hard-soft: #362A14; --gold: #FFD24D;
    --puff: #2B3753; --ground: rgba(0,0,0,.40); --scrim: rgba(13,16,22,.74);
    --sheen: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 38%);
    --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 8px 16px -8px rgba(0,0,0,.45), 0 22px 44px -16px rgba(0,0,0,.55);
    --shadow-float: 0 14px 34px -12px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1016; --surface: #171C26; --surface-2: #1D2330; --ink: #EDF0F5; --ink-2: #C3C9D4; --muted: #8C95A7;
  --line: rgba(255,255,255,.09); --hair: rgba(255,255,255,.07); --track: #262D3A;
  --brand: #5B8CFF; --brand-2: #8AADFF; --brand-ink: #0A1122; --brand-soft: #1A2541; --brand-line: rgba(91,140,255,.40);
  --again: #FF7479; --again-soft: #3A1D22; --hard: #F0B44C; --hard-soft: #362A14; --gold: #FFD24D;
  --puff: #2B3753; --ground: rgba(0,0,0,.40); --scrim: rgba(13,16,22,.74);
  --sheen: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 38%);
  --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 8px 16px -8px rgba(0,0,0,.45), 0 22px 44px -16px rgba(0,0,0,.55);
  --shadow-float: 0 14px 34px -12px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p, ol, ul, li { margin: 0; }
ol, ul { list-style: none; padding: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
svg { display: inline-block; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
#root {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tnum { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- 공통 조각 ---------- */
.logo {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(160deg, var(--brand-2), var(--brand)); color: var(--brand-ink);
  font-family: var(--f-word); font-style: italic; font-weight: 600; font-size: 20px;
  box-shadow: 0 6px 14px -6px var(--brand-line);
}
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); }
.display { font-size: clamp(32px, 5.2vw, 52px); font-weight: 700; letter-spacing: -.035em; line-height: 1.12; }
.lead { color: var(--ink-2); max-width: 34em; font-size: 15.5px; }
.chip-quiet {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
  padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
}
.legend { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2);
  padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--hair); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 22px; box-shadow: var(--shadow-card); background-image: var(--sheen); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--line); transition: transform .3s var(--spring), color .2s; }
.icon-btn:hover { color: var(--ink); transform: translateY(-1px); }
.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px;
  border-radius: 15px; font-weight: 600; color: var(--brand-ink); border: 0;
  background: linear-gradient(180deg, var(--brand-2) -60%, var(--brand) 70%);
  box-shadow: 0 10px 22px -10px var(--brand-line), inset 0 1px 0 rgba(255,255,255,.22);
  transition: transform .35s var(--spring), box-shadow .35s var(--spring);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 26px -10px var(--brand-line), inset 0 1px 0 rgba(255,255,255,.22); }
.btn-primary:active { transform: scale(.985); }
.btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 13px; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line);
  transition: transform .3s var(--spring), border-color .2s;
}
.btn-ghost:hover { border-color: var(--brand-line); transform: translateY(-1px); }
.btn-danger { color: var(--again); }
.link-quiet { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); padding: 6px 2px; }
.link-quiet:hover { color: var(--ink-2); }

/* ---------- 대시보드 ---------- */
.stat-num { font-family: var(--f-word); font-weight: 500; font-size: 64px; line-height: 1; letter-spacing: -.02em; }
.bar { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; transform-origin: left; background: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: transform .8s var(--spring); }
.section-title { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.section-icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.mode {
  position: relative; text-align: left; display: grid; gap: 16px; padding: 22px 22px 20px; border-radius: 22px;
  background: var(--surface); background-image: var(--sheen); border: 1px solid var(--hair); box-shadow: var(--shadow-card);
  transition: transform .45s var(--spring), box-shadow .45s var(--spring); cursor: pointer; min-width: 0;
}
.mode:hover:not([aria-disabled="true"]) { transform: translateY(-4px); box-shadow: var(--shadow-card), 0 0 0 1px var(--brand-line); }
.mode:active:not([aria-disabled="true"]) { transform: translateY(-1px) scale(.99); }
.mode[aria-disabled="true"] { cursor: not-allowed; opacity: .55; }
.mode { grid-template-rows: auto 1fr auto; }
.mode .flow { align-content: start; }
.mode-num { font-family: var(--f-word); font-weight: 500; font-size: 56px; line-height: .95; letter-spacing: -.03em; }
.mode-unit { font-size: 13px; color: var(--muted); font-weight: 500; }
.flow { display: grid; gap: 7px; }
.flow li { position: relative; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.flow li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--brand); background: var(--surface); flex: none; position: relative; z-index: 1; }
.flow li:last-child::before { background: var(--brand); }
.flow li + li::after { content: ""; position: absolute; left: 3px; top: -10px; height: 12px; border-left: 1.5px dotted var(--brand-line); }
.mode-cta { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--brand); }
.mode[aria-disabled="true"] .mode-cta { color: var(--muted); }
.resume {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 14px 14px 14px 16px;
  border-radius: 18px; background: var(--brand-soft); border: 1px solid var(--brand-line);
}
.resume-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--brand); color: var(--brand-ink); }
.review-fab {
  position: fixed; z-index: 20;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 11px; padding: 9px 16px 9px 9px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--hair); box-shadow: var(--shadow-float); text-align: left;
  transition: transform .4s var(--spring), box-shadow .4s var(--spring);
}
.review-fab:hover { transform: translateY(-2px); }
.review-fab .ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(160deg, var(--brand-2), var(--brand)); color: var(--brand-ink); flex: none; }
.review-fab .badge { min-width: 24px; height: 22px; padding: 0 7px; border-radius: 999px; display: inline-grid; place-items: center;
  font-size: 12px; font-weight: 700; background: var(--brand-soft); color: var(--brand); }

/* ---------- 단계 막대 ---------- */
.stepper { display: flex; gap: 6px; }
.step { flex: 1 1 0; min-width: 0; display: grid; gap: 7px; }
.step-bar { height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; display: block; }
.step-fill { display: block; height: 100%; transform-origin: left; border-radius: inherit;
  background: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: transform .7s var(--spring); }
.step-name { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.is-cur .step-name { color: var(--ink); font-weight: 600; }
.step.is-skip .step-name { text-decoration: line-through; }

/* ---------- 카드 ---------- */
.card-stage { position: relative; perspective: 1700px; }
.ghost { position: absolute; inset: 0; border-radius: 26px; background: var(--surface); border: 1px solid var(--hair); box-shadow: var(--shadow-card); pointer-events: none; transition: transform .5s var(--spring), opacity .5s; }
.ghost-1 { transform: translateY(13px) scale(.955); opacity: .75; }
.ghost-2 { transform: translateY(26px) scale(.91); opacity: .4; }
.card-wrap { position: relative; z-index: 1; will-change: transform; }
.card-3d { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 10.4; transform-style: preserve-3d; will-change: transform; }
.face {
  position: absolute; inset: 0; border-radius: 26px; overflow: hidden;
  background: var(--surface); background-image: var(--sheen);
  border: 1px solid var(--hair); box-shadow: var(--shadow-card);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: grid; place-items: center; text-align: center; padding: 48px 24px 56px;
}
.face-back { transform: rotateY(180deg); }
.face-top { position: absolute; top: 18px; left: 18px; right: 18px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; }
.face-hint { position: absolute; left: 72px; right: 72px; bottom: 27px; font-size: 12.5px; color: var(--muted); }
.headword { font-family: var(--f-word); font-weight: 500; font-size: clamp(38px, 9vw, 66px); letter-spacing: -.015em; line-height: 1.04; overflow-wrap: anywhere; }
.back-word { font-family: var(--f-word); font-style: italic; font-size: 19px; color: var(--ink-2); }
.meaning { font-weight: 700; font-size: clamp(26px, 6.4vw, 40px); line-height: 1.3; letter-spacing: -.02em; word-break: keep-all; text-wrap: balance; padding: 0 8px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.tag-new, .tag-know { background: var(--brand-soft); color: var(--brand); }
.tag-again { background: var(--again-soft); color: var(--again); }
.tag-hard { background: var(--hard-soft); color: var(--hard); }
.timer { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--track); }
.timer-fill { position: absolute; inset: 0; transform-origin: left; background: var(--brand); transition: background-color .35s; }
.timer[data-zone="mid"] .timer-fill { background: var(--hard); }
.timer[data-zone="over"] .timer-fill { background: var(--again); animation: blink 1s ease-in-out infinite; }
.timer-tick { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--surface); }
.face.is-over { animation: breathe 1.3s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { box-shadow: var(--shadow-card), inset 0 0 0 1px var(--hair); } 50% { box-shadow: var(--shadow-card), inset 0 0 0 2px var(--again); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@media (max-width: 520px) { .card-3d { aspect-ratio: 4 / 3.5; } .face-hint { left: 64px; right: 64px; } }

.speak {
  position: absolute; left: 16px; bottom: 16px; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--hair);
  transition: transform .3s var(--spring), color .2s, background-color .2s; z-index: 2;
}
.speak:hover:not(:disabled) { color: var(--brand); transform: scale(1.06); }
.speak:active:not(:disabled) { transform: scale(.94); }
.speak:disabled { opacity: .45; cursor: not-allowed; }
.speak.is-on { color: var(--brand); background: var(--brand-soft); border-color: var(--brand-line); }
.speak.is-on::before, .speak.is-on::after {
  content: ""; position: absolute; inset: -1px; border-radius: 50%; border: 2px solid var(--brand); opacity: 0;
  animation: ring 1.5s cubic-bezier(.2,.6,.3,1) infinite;
}
.speak.is-on::after { animation-delay: .75s; }
.speak.is-on svg { animation: nudge .75s ease-in-out infinite; }
@keyframes ring { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.9); opacity: 0; } }
@keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

/* ---------- 보기 ---------- */
.choices { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .choices { grid-template-columns: 1fr 1fr; } .choices > .choice:last-child:nth-child(odd) { grid-column: 1 / -1; } }
.choice {
  display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 12px 16px; border-radius: 17px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(15,23,38,.04);
  font-weight: 500; font-size: 15.5px; line-height: 1.35; word-break: keep-all; min-width: 0;
  transition: transform .35s var(--spring), border-color .2s, background-color .2s, opacity .25s;
  animation: rise .55s var(--spring) both;
}
.choice:hover:not(:disabled) { border-color: var(--brand-line); transform: translateY(-2px); }
.choice:active:not(:disabled) { transform: scale(.985); }
.choice:disabled { cursor: default; }
.choice .key { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 600;
  color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); transition: background-color .2s, color .2s; }
.choice.is-correct { background: var(--brand-soft); border-color: var(--brand); }
.choice.is-correct .key { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.choice.is-wrong { background: var(--again-soft); border-color: var(--again); animation: shake .42s cubic-bezier(.36,.07,.19,.97) both; }
.choice.is-wrong .key { background: var(--again); color: var(--surface); border-color: var(--again); }
.choice.is-dim { opacity: .45; }
.verdict-row { min-height: 34px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.verdict { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600; animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
.hint-row { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.hint-row span { display: inline-flex; align-items: center; gap: 6px; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@keyframes shake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(3px); } 30%, 50%, 70% { transform: translateX(-5px); } 40%, 60% { transform: translateX(5px); } }
.kbd { font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--surface); color: var(--ink-2); }

/* ---------- 덮개·시트 ---------- */
.overlay, .sheet-wrap {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.scrim { position: fixed; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2); animation: fade .35s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { position: relative; width: min(440px, 100%); padding: 22px; border-radius: 24px; background: var(--surface); border: 1px solid var(--hair); box-shadow: var(--shadow-float); display: grid; gap: 16px; }
@media (max-width: 560px) {
  .sheet-wrap { place-items: end center; padding-bottom: 0; }
  .sheet { border-radius: 24px 24px 0 0; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
}
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface); text-align: left; transition: transform .3s var(--spring), border-color .2s; }
.opt:hover:not(:disabled) { border-color: var(--brand-line); transform: translateY(-1px); }
.opt:disabled { opacity: .45; cursor: not-allowed; }

.celebrate { position: relative; display: grid; justify-items: center; gap: 4px; width: min(430px, 100%); }
.stage-mascot { position: relative; width: 230px; height: 200px; display: grid; place-items: center; }
.puff { position: absolute; left: calc(50% - 30px); top: calc(50% - 30px); width: 60px; height: 60px; border-radius: 50%; background: var(--puff); opacity: 0;
  animation: puff .9s cubic-bezier(.15,.7,.3,1) both; }

ning":"궤변"},{"word":"superfluous","meaning":"불필요한"},{"word":"tantamount","meaning":"맞먹는"},{"word":"temerity","meaning":"무모함"},{"word":"tenacious","meaning":"끈질긴"},{"word":"tenuous","meaning":"미약한"},{"word":"trenchant","meaning":"예리한"},{"word":"tumultuous","meaning":"격동의"},{"word":"ubiquitous","meaning":"어디에나 있는"},{"word":"untenable","meaning":"옹호할 수 없는"},{"word":"usurp","meaning":"찬탈하다"},{"word":"urbane","meaning":"세련된"},{"word":"vacillate","meaning":"갈팡질팡하다"},{"word":"venal","meaning":"돈으로 매수되는"},{"word":"venerate","meaning":"공경하다"},{"word":"veracity","meaning":"진실성"},{"word":"verbose","meaning":"장황한"},{"word":"vilify","meaning":"비방하다"},{"word":"vindicate","meaning":"옳음을 입증하다"},{"word":"virulent","meaning":"악성의"},{"word":"volatile","meaning":"불안정한"},{"word":"voracious","meaning":"게걸스러운"},{"word":"vacuous","meaning":"공허한"},{"word":"wane","meaning":"쇠퇴하다"},{"word":"whimsical","meaning":"엉뚱한"},{"word":"wistful","meaning":"아쉬워하는"},{"word":"wily","meaning":"교활한"},{"word":"xenophobia","meaning":"외국인 혐오"},{"word":"zealot","meaning":"광신자"},{"word":"zenith","meaning":"정점"},{"word":"zeitgeist","meaning":"시대정신"}];
const WORDS = WORDS_RAW.map((w, i) => ({ id: i + 1, word: w.word, meaning: w.meaning, errorCount: 0, status: "unlearned" }));
const BY_ID = Object.fromEntries(WORDS.map(w => [w.id, w]));
const ALL_IDS = WORDS.map(w => w.id);

/* --- 시간 판정 --- */
const T_FAST = 3000;   // 3초 이하 정답: 완벽히 앎
const T_SLOW = 6000;   // 6초 이하 정답: 조금 헷갈림, 그 이상이거나 오답: 전혀 모름
const GRADES = {
  know:  { offsets: null,   penalty: 0, label: "완벽히 앎" },
  hard:  { offsets: [6, 7], penalty: 1, label: "조금 헷갈림" },
  again: { offsets: [3, 4], penalty: 2, label: "전혀 모름" }
};
const PREVIEW_OFFSETS = [3, 4]; // 처음 본 단어는 익히기 카드 뒤 3~4장 후에 시험
const LINES = ["Great!", "Excellent!", "Unbelievable!"];

function judge(correct, ms) {
  if (!correct || ms > T_SLOW) return "again";
  if (ms <= T_FAST) return "know";
  return "hard";
}

/* --- 큐 --- */
function insertAt(queue, offsets, rand) {
  const [cur, ...rest] = queue;
  const [a, b] = offsets;
  const off = a + Math.floor(rand() * (b - a + 1));
  const at = Math.min(off, rest.length);
  return [...rest.slice(0, at), cur, ...rest.slice(at)];
}
function reinsert(queue, grade, rand = Math.random) {
  const g = GRADES[grade];
  if (!g.offsets) return queue.slice(1);
  return insertAt(queue, g.offsets, rand);
}
function shuffle(arr, rand = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* --- 보기 만들기: 같은 품사 모양을 먼저 오답으로 --- */
function posOf(meaning) {
  const m = meaning.trim();
  if (/다$/.test(m)) return "verb";
  if (/(한|인|는|은|된|의|던|운|울|적인|같은|만한)$/.test(m) && !/(행운|기운)$/.test(m)) return "adj";
  return "noun";
}
function makeChoices(id, n, rand = Math.random) {
  const target = BY_ID[id];
  const p = posOf(target.meaning);
  const pool = WORDS.filter(w => w.id !== id && w.meaning !== target.meaning);
  const same = shuffle(pool.filter(w => posOf(w.meaning) === p), rand);
  const other = shuffle(pool.filter(w => posOf(w.meaning) !== p), rand);
  const wrong = [...same, ...other].slice(0, n - 1).map(w => w.id);
  return shuffle([id, ...wrong], rand);
}

/* --- 단계 --- */
function buildPhases(ids) {
  const n = ids.length;
  if (n <= 10) return [{ kind: "final", name: "최종 테스트", ids }];
  const half = Math.ceil(n / 2);
  const A = ids.slice(0, half), B = ids.slice(half);
  const phases = [
    { kind: "set", name: "묶음 A", ids: A },
    { kind: "set", name: "묶음 B", ids: B }
  ];
  if (n >= 40) phases.push({ kind: "care", name: "집중 오답 케어", size: Math.round(n / 4), A, B, ids: null });
  phases.push({ kind: "final", name: "최종 테스트", ids });
  return phases;
}
function flowOf(n) {
  return buildPhases(Array.from({ length: n }, (_, i) => i + 1)).map(p =>
    p.kind === "care" ? `오답 케어 ${p.size}` : p.kind === "final" ? `최종 테스트 ${p.ids.length}` : `${p.name} ${p.ids.length}`);
}
// 오답 횟수 높은 순(같으면 원래 순서). 한 번도 안 틀린 단어는 제외.
function topErr(ids, err, k) {
  const pos = new Map(ids.map((id, i) => [id, i]));
  return ids.filter(id => (err[id] || 0) > 0)
    .sort((x, y) => (err[y] - err[x]) || (pos.get(x) - pos.get(y)))
    .slice(0, k);
}
// 25% 룰: A·B에서 절반씩. 한쪽이 모자라면 다른 쪽의 다음 오답으로 채움.
function pickCare(A, B, err, size) {
  const half = Math.floor(size / 2);
  const pick = [...topErr(A, err, half), ...topErr(B, err, size - half)];
  const rest = topErr([...A, ...B], err, A.length + B.length).filter(id => !pick.includes(id));
  while (pick.length < size && rest.length) pick.push(rest.shift());
  return pick;
}
function phaseIds(phase, err) {
  return phase.kind === "care" ? pickCare(phase.A, phase.B, err, phase.size) : phase.ids;
}

/* --- 저장 상태 --- */
const STORE_VERSION = 2;
function freshStore(rand = Math.random) {
  return { v: STORE_VERSION, progress: {}, order: shuffle(ALL_IDS, rand), session: null };
}
function normalizeStore(raw, rand = Math.random) {
  if (!raw || raw.v !== STORE_VERSION || !Array.isArray(raw.order)) return freshStore(rand);
  const order = raw.order.filter(id => BY_ID[id]);
  const have = new Set(order);
  const missing = ALL_IDS.filter(id => !have.has(id));
  const s = raw.session;
  const session = s && Array.isArray(s.ids) && s.ids.length && s.ids.every(id => BY_ID[id]) && Array.isArray(s.queue) ? s : null;
  const progress = { ...(raw.progress || {}) };
  if (!session) {
    for (const k of Object.keys(progress)) if (progress[k].status === "in_progress") progress[k] = { ...progress[k], status: "unlearned" };
  }
  return { v: STORE_VERSION, progress, order: [...order, ...shuffle(missing, rand)], session };
}
const prog = (store, id) => store.progress[id] || {};
const statusOf = (store, id) => prog(store, id).status || "unlearned";
const errOf = (store, id) => prog(store, id).errorCount || 0;
function patch(store, ids, fn) {
  const progress = { ...store.progress };
  for (const id of ids) {
    const cur = progress[id] || { status: "unlearned", errorCount: 0 };
    progress[id] = { ...cur, ...fn(cur) };
  }
  return { ...store, progress };
}
function counts(store) {
  const c = { total: ALL_IDS.length, learned: 0, unlearned: 0, inProgress: 0 };
  for (const id of ALL_IDS) {
    const st = statusOf(store, id);
    if (st === "learned") c.learned++; else if (st === "in_progress") c.inProgress++; else c.unlearned++;
  }
  return c;
}

/* --- 단어 뽑기 --- */
function drawNew(store, n) {

}

  return ALL_IDS.filter(id => statusOf(store, id) === "learned")
    .sort((a, b) => (errOf(store, b) - errOf(store, a)) || (last(a) - last(b)) || (a - b))
    .slice(0, n);
}
function drawQuiz(store, n) {
  const q = id => prog(store, id).lastQuizAt || 0;
  const learned = ALL_IDS.filter(id => statusOf(store, id) === "learned")
    .sort((a, b) => (q(a) - q(b)) || (errOf(store, b) - errOf(store, a)) || (a - b));

/* --- 세션 상태 기계 --- */
function enterPhase(store, idx, rand, now) {

  if (s.source === "review") return patch(store, s.ids, () => ({ lastReviewedAt: now }));

}

function reduce(store, a, rand = Math.random) {

    }
    case "ANSWER": {
      if (!s || s.stage !== "study" || !s.queue.length) return store;
      const id = s.queue[0];
      if (!s.seen[id]) return store;

      const pen = GRADES[grade].penalty;
      const err = pen ? { ...s.err, [id]: (s.err[id] || 0) + pen } : s.err;
      const firstOk = id in s.firstOk ? s.firstOk : { ...s.firstOk, [id]: !!a.correct };
      const firstMs = id in s.firstMs ? s.firstMs : { ...s.firstMs, [id]: ms };
      let st = pen ? patch(store, [id], p => ({ errorCount: (p.errorCount || 0) + pen })) : store;
      const queue = reinsert(s.queue, grade, rand);
      let ns = { ...s, err, firstOk, firstMs, queue, tally: { ...s.tally, [grade]: s.tally[grade] + 1 }, answers: s.answers + 1, cardKey: s.cardKey + 1 };
      if (!queue.length) {
        if (s.phaseIdx === s.phases.length - 1) {
          ns = { ...ns, stage: "finalDone", finalized: true };
          st = finalize(st, ns, now);

        }

      return { ...st, session: ns };
    }
    case "NEXT": {
      if (!s) return store;
      if (s.stage === "phaseDone") return enterPhase(store, s.phaseIdx + 1, rand, now);

    case "ABANDON": {

    const [zone, setZone] = useState("fast");
    const wrapRef = useRef(null), innerRef = useRef(null), barRef = useRef(null);
    const angle = useRef(0), busy = useRef(false), zoneRef = useRef("fast"), raf = useRef(0), timers = useRef([]);
    const T = useRef({ start: 0, paused: 0, pausedAt: 0, running: false });
    const err = s.err[w.id] || 0;
    const later = (fn, ms) => { timers.current.push(setTimeout(fn, ms)); };

    const elapsed = () => {
      const t = T.current;
      if (!t.start) return 0;
      return (t.pausedAt || performance.now()) - t.start - t.paused;
    };
    const tick = () => {
      const t = T.current;
      if (!t.running) return;
      const ms = elapsed();
      const z = ms <= L.T_FAST ? "fast" : ms <= L.T_SLOW ? "mid" : "over";
      if (barRef.current) barRef.current.style.transform = z === "over" ? "scaleX(1)" : `scaleX(${Math.max(0, 1 - ms / L.T_SLOW)})`;
      if (z !== zoneRef.current) { zoneRef.current = z; setZone(z); }
      raf.current = requestAnimationFrame(tick);
    };
    const begin = () => {
      if (preview || T.current.start) return;
      T.current = { start: performance.now(), paused: 0, pausedAt: 0, running: true };
      raf.current = requestAnimationFrame(tick);
    };

    // 등장(뒤 카드에서 앞으로 올라옴) → 다 멈춘 뒤 타이머 시작
    useLayoutEffect(() => {
      let alive = true;
      const el = wrapRef.current;
      if (RM || !el) begin();
      else {
        const a = animateSpring(el, v => ({ transform: `translateY(${(1 - v) * 24}px) scale(${0.955 + 0.045 * v})` }), { from: 0, to: 1, stiffness: 250, damping: 24 });
        a.finished.then(() => { if (alive) begin(); }, () => {});
      }
      const onVis = () => {
        const t = T.current;
        if (!t.running) return;
        if (document.hidden) { if (!t.pausedAt) t.pausedAt = performance.now(); }
        else if (t.pausedAt) { t.paused += performance.now() - t.pausedAt; t.pausedAt = 0; }
      };
      document.addEventListener("visibilitychange", onVis);
      return () => {
        alive = false; T.current.running = false; cancelAnimationFrame(raf.current);
        timers.current.forEach(clearTimeout);
        document.removeEventListener("visibilitychange", onVis);
      };
    }, []);

    // 3D 뒤집기: 스프링으로 회전, 가운데에서 살짝 떠오름
    useLayoutEffect(() => {
      const el = innerRef.current;
      if (!el) return;
      const to = flipped ? 180 : 0, from = angle.current;
      if (from === to) return;
      angle.current = to;
      el.style.transform = `rotateY(${to}deg)`;
      if (RM) return;
      animateSpring(el, a => ({ transform: `rotateY(${a}deg) scale(${1 + 0.035 * Math.sin(Math.PI * Math.min(1, Math.max(0, a / 180)))})` }),
        { from, to, stiffness: 200, damping: 21 });
    }, [flipped]);

    const leave = (grade, res) => {
      if (busy.current) return;
      busy.current = true;
      timers.current.forEach(clearTimeout);
      const go = () => dispatch(res ? { type: "ANSWER", correct: res.correct, ms: res.ms } : { type: "PREVIEW_DONE" });
      const el = wrapRef.current;
      if (RM || !el) { go(); return; }
      el.animate([{ transform: "none", opacity: 1 }, { transform: EXIT[grade], opacity: 0 }],
        { duration: 330, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" }).finished.then(go, go);
    };
    const choose = (cid) => {
      if (preview || picked || busy.current) return;
      if (!T.current.start) begin();
      const ms = Math.round(elapsed());
      T.current.running = false; cancelAnimationFrame(raf.current);
      const correct = cid === w.id;
      const grade = L.judge(correct, ms);
      const res = { cid, correct, ms, grade };
      setPicked(res);
      if (grade === "know") later(() => leave("know", res), 760);
      else later(() => setFlipped(true), 300);
    };
    const next = () => {
      if (busy.current) return;
      if (preview) { if (!flipped) setFlipped(true); else leave("preview"); return; }
      if (picked && picked.grade !== "know") leave(picked.grade, picked);
    };
    const onCard = () => {
      if (preview) { next(); return; }
      if (picked && picked.grade !== "know") setFlipped(f => !f);
    };

    useEffect(() => {
      if (!active) return undefined;
      const onKey = (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const tag = e.target && e.target.tagName;
        if (/^[1-5]$/.test(e.key)) {
          const c = choices[Number(e.key) - 1];
          if (c !== undefined) { e.preventDefault(); choose(c); }
          return;
        }
        if (e.key === "p" || e.key === "P") { e.preventDefault(); speak(w.id, w.word); return; }
        if (e.key === " " || e.key === "Enter") {
          if (tag === "BUTTON") return; // 버튼에 포커스가 있으면 버튼 기본 동작에 맡김
          e.preventDefault(); next();
        }
      };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    });

    const v = picked && verdictOf(picked);
    const speaking = speakingId === w.id;
    const prompt = preview ? "탭해서 뜻 보기" : picked ? (picked.grade === "know" ? "" : "탭하면 다시 뒤집혀요") : (nChoices === 5 ? "다섯 개의 뜻 중에서 골라 주세요" : "네 개의 뜻 중에서 골라 주세요");

    return html`
      <div class="grid gap-5">
        <div class="card-stage">
          ${ghosts > 1 && html`<div class="ghost ghost-2" aria-hidden="true"></div>`}
          ${ghosts > 0 && html`<div class="ghost ghost-1" aria-hidden="true"></div>`}
          <div ref=${wrapRef} class="card-wrap">
            <div ref=${innerRef} class="card-3d" onClick=${onCard} style=${{ cursor: preview || (picked && picked.grade !== "know") ? "pointer" : "default" }}>
              <section class=${"face" + (zone === "over" && !picked ? " is-over" : "")} aria-hidden=${flipped}>
                ${!preview && html`
                  <div class="timer" data-zone=${zone} aria-hidden="true"><div ref=${barRef} class="timer-fill"></div><span class="timer-tick"></span></div>`}
                <div class="face-top">
                  <span>${preview
                    ? html`<span class="tag tag-new"><${I.Sparkles} size=${13} /> 처음 보는 단어</span>`
                    : err > 0 ? html`<span class="tag tag-again">다시 · 오답 ${err}</span>` : null}</span>
                  <span class="text-[12px] text-muted tnum">남은 카드 ${s.queue.length}</span>
                </div>
                <h3 class="headword" lang="en">${w.word}</h3>
                <p class="face-hint">${prompt}</p>
                <${SpeakButton} word=${w.word} active=${speaking} hidden=${flipped} onSpeak=${() => speak(w.id, w.word)} />
              </section>
              <section class="face face-back" aria-hidden=${!flipped}>
                <div class="face-top">
                  <span class="back-word" lang="en">${w.word}</span>
                  ${v && html`<span class=${"tag " + v.cls}>${v.short}</span>`}
                </div>
                <p class="meaning">${w.meaning}</p>
                <p class="face-hint">${preview ? "소리 내어 한 번 읽어 보세요" : ""}</p>
                <${SpeakButton} word=${w.word} active=${speaking} hidden=${!flipped} onSpeak=${() => speak(w.id, w.word)} />
              </section>
            </div>
          </div>
        </div>

        ${preview ? html`
          <div class="grid gap-3">
            <button type="button" class="btn-primary w-full" onClick=${next}>
              ${flipped ? html`익혔어요 · 다음 <${I.ArrowRight} size=${18} />` : html`<${I.RotateCcw} size=${18} /> 뜻 보기`}
            </button>
            <p class="hint-row"><span>처음 보는 단어는 시간을 재지 않아요. 3~4장 뒤에 다시 나오면 그때부터 잽니다.</span></p>
          </div>` : html`
          <div class="grid gap-3">
            <div class="verdict-row" aria-live="polite">
              ${v ? html`<span class=${"verdict " + v.cls}><${v.icon} size=${15} /> ${v.long}</span>`
                  : html`<p class="hint-row">
                      <span><i class="dot" style=${{ background: "var(--brand)" }}></i>3초 이내 통과</span>
                      <span><i class="dot" style=${{ background: "var(--hard)" }}></i>6초 이내 6~7장 뒤</span>
                      <span><i class="dot" style=${{ background: "var(--again)" }}></i>그 외 3~4장 뒤</span>
                    </p>`}
            </div>
            <div class="choices" role="group" aria-label="뜻 고르기">
              ${choices.map((cid, i) => {
                let cls = "choice";
                if (picked) cls += cid === w.id ? " is-correct" : cid === picked.cid ? " is-wrong" : " is-dim";
                return html`
                  <button key=${cid} type="button" class=${cls} disabled=${!!picked} onClick=${() => choose(cid)}
                    style=${{ animationDelay: (0.04 + i * 0.05) + "s" }}>
                    <span class="key tnum">${i + 1}</span><span class="min-w-0">${L.BY_ID[cid].meaning}</span>
                  </button>`;
              })}
            </div>
            ${picked && picked.grade !== "know" && html`
              <button type="button" class="btn-primary w-full" onClick=${next} style=${{ animation: "rise .5s var(--spring) .15s both" }}>
                다음 <span class="kbd" style=${{ background: "transparent", color: "inherit", borderColor: "currentColor", opacity: .6 }}>Enter</span>
              </button>`}
          </div>`}
      </div>`;
  }

  /* ---------- 학습 화면 ---------- */
  function Stepper({ s }) {
    const total = s.setIds.length || 1;
    const done = total - s.queue.length;
    if (s.mode === "quiz") {
      return html`
        <div class="stepper" aria-label="퀴즈 진행">
          <div class="step is-cur"><span class="step-bar" style=${{ height: "6px" }}><span class="step-fill" style=${{ transform: `scaleX(${s.stage === "study" ? done / total : 1})` }}></span></span></div>
        </div>`;
    }
    return html`
      <ol class="stepper" aria-label="단계 진행">
        ${s.phases.map((p, i) => {
          const skipped = s.skipped.includes(i);
          const cur = i === s.phaseIdx;
          const frac = skipped ? 0 : i < s.phaseIdx ? 1 : cur ? (s.stage === "study" ? done / total : 1) : 0;
          const n = p.ids ? p.ids.length : (cur ? s.setIds.length : p.size);
          return html`
            <li key=${i} class=${"step" + (cur ? " is-cur" : "") + (skipped ? " is-skip" : "")}>
              <span class="step-bar"><span class="step-fill" style=${{ transform: `scaleX(${frac})` }}></span></span>
              <span class="step-name">${p.name} <span class="tnum">${n}</span></span>
            </li>`;
        })}
      </ol>`;
  }

  function celebrateProps(s, dispatch) {
    const line = L.cheerFor(s);
    const onNext = () => dispatch({ type: "NEXT" });
    const phase = s.phases[s.phaseIdx];
    if (s.stage === "finalDone") {
      const title = s.mode === "quiz" ? `퀴즈 ${s.size}문항 완료` : s.source === "review" ? `${s.size}개 복습 완료` : `${s.size}개를 모두 외웠어요`;
      const detail = s.mode === "quiz"
        ? `첫 시도 정답률 ${L.accuracy(s)}% · 평균 ${(L.avgMs(s) / 1000).toFixed(1)}초`
        : s.source === "review" ? "최종 테스트까지 모두 3초 안에 통과했어요." : `최종 테스트 통과. 외운 단어에 ${s.size}개가 추가됐어요.`;
      return { line, title, detail, next: null, cta: "결과 보기", onNext, big: true };
    }
    const nextPhase = s.phases[s.phaseIdx + 1];
    const repeated = s.setIds.filter(id => (s.err[id] || 0) > 0).length;
    const nextDesc = nextPhase.kind === "care" ? `A·B에서 많이 틀린 단어 최대 ${nextPhase.size}개를 모아 집중 반복해요. 틀린 단어가 없으면 건너뜁니다.`
      : nextPhase.kind === "final" ? `${nextPhase.ids.length}개 전체를 섞어서 최종 테스트해요.` : `${nextPhase.ids.length}개를 같은 방식으로 외워요.`;
    return {
      line,
      title: `${phase.name} 통과`,
      detail: `${s.setIds.length}개를 모두 3초 안에 맞혔어요.${repeated ? ` 그중 ${repeated}개는 다시 나왔던 단어예요.` : " 한 번도 다시 나온 단어가 없어요."}`,
      next: { eyebrow: `다음 · Phase ${s.phaseIdx + 2}`, title: nextPhase.name, desc: nextDesc },
      cta: "다음 단계 시작", onNext, big: false
    };
  }

  function Study({ s, dispatch, speakingId, speak, goHome, active }) {
    const phase = s.phases[s.phaseIdx];
    const total = s.setIds.length;
    const done = total - s.queue.length;
    const id = s.stage === "study" ? s.queue[0] : null;
    const w = id ? L.BY_ID[id] : null;
    const preview = !!w && s.mode === "learn" && !s.seen[id];
    const ghosts = Math.max(0, Math.min(2, s.queue.length - 1));
    const label = s.mode === "quiz" ? "객관식 퀴즈" : s.source === "review" ? "전에꺼 외우기" : "단어 암기";
    const overlay = s.stage === "phaseDone" || s.stage === "finalDone";
    return html`
      <div class="max-w-[640px] mx-auto pt-5 pb-16 grid gap-5">
        <div class="flex items-center justify-between gap-3">
          <button type="button" class="icon-btn" onClick=${goHome} aria-label="나가기. 진행 상황은 저장돼요" title="나가기 (진행 상황은 저장돼요)"><${I.X} size=${18} /></button>
          <div class="text-center min-w-0">
            <p class="text-[13.5px] font-semibold truncate">${label} · ${s.size}${s.mode === "quiz" ? "문항" : "개"}</p>
            <p class="text-[12px] text-muted tnum">${s.mode === "quiz" ? "3초 안에 맞히면 통과" : `Phase ${s.phaseIdx + 1} / ${s.phases.length}`}</p>
          </div>
          <div class="w-10" aria-hidden="true"></div>
        </div>
        <${Stepper} s=${s} />
        <div class="flex items-end justify-between gap-3">
          <h2 class="text-[21px] font-bold tracking-tight">${phase.name}</h2>
          <p class="text-[13px] text-muted tnum">통과 <b class="text-ink">${done}</b> / ${total}</p>
        </div>
        ${w ? html`<${CardRun} key=${s.cardKey} s=${s} w=${w} preview=${preview} ghosts=${ghosts}
                     dispatch=${dispatch} speakingId=${speakingId} speak=${speak} active=${active && !overlay} />`
            : html`<div class="card-stage"><div class="card-3d"><div class="face"><p class="text-muted">이번 단계 완료</p></div></div></div>`}
        ${s.mode === "learn" && html`<p class="hidden sm:flex hint-row justify-center"><span><span class="kbd">1</span>–<span class="kbd">5</span> 보기 선택</span><span><span class="kbd">Space</span> 뒤집기·다음</span><span><span class="kbd">P</span> 발음</span></p>`}
        ${s.mode === "quiz" && html`<p class="hidden sm:flex hint-row justify-center"><span><span class="kbd">1</span>–<span class="kbd">4</span> 보기 선택</span><span><span class="kbd">Enter</span> 다음</span><span><span class="kbd">P</span> 발음</span></p>`}
        ${overlay && html`<${Celebrate} key=${s.stage + s.phaseIdx} ...${celebrateProps(s, dispatch)} />`}
      </div>`;
  }

  /* ---------- 결과 화면 ---------- */
  function Result({ s, store, onClose, onAgain, speakingId, speak }) {
    const line = L.cheerFor(s);
    const isQuiz = s.mode === "quiz";
    const top = L.topMissed(s, 5);
    const max = top.length ? s.err[top[0]] : 1;
    const c = L.counts(store);
    const canAgain = s.source === "new" ? c.unlearned >= s.size : s.source === "review" ? c.learned > 0 : true;
    const title = isQuiz ? `퀴즈 ${s.size}문항 완료` : s.source === "review" ? `${s.size}개 복습 완료` : `${s.size}개를 모두 외웠어요`;
    const sub = isQuiz ? `첫 시도 정답률 ${L.accuracy(s)}% · 평균 응답 ${(L.avgMs(s) / 1000).toFixed(1)}초`
      : s.source === "review" ? "외운 단어 목록은 그대로 유지돼요." : `외운 단어가 모두 ${c.learned}개가 됐어요.`;
    const stats = isQuiz
      ? [["첫 시도 정답률", L.accuracy(s) + "%"], ["평균 응답", (L.avgMs(s) / 1000).toFixed(1) + "초"], ["푼 문제 수", s.answers], ["다시 나온 횟수", s.tally.hard + s.tally.again]]
      : [["푼 카드 수", s.answers], ["3초 안 통과", s.tally.know], ["6초 안 정답", s.tally.hard], ["느림·오답", s.tally.again]];
    const again = isQuiz ? `퀴즈 ${s.size}문항 다시` : s.source === "review" ? "한 번 더 복습" : `새 단어 ${s.size}개 이어서`;
    return html`
      <div class="max-w-[640px] mx-auto pt-8 pb-28 grid gap-6">
        <section class="grid justify-items-center gap-3 text-center">
          <div class="bob"><${Mascot} pose=${POSE[line]} size=${120} /></div>
          <p class="eyebrow">${line}</p>
          <h1 class="text-[30px] font-bold tracking-tight leading-tight">${title}</h1>
          <p class="text-ink-2">${sub}</p>
        </section>
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          ${stats.map(([k, val]) => html`
            <div key=${k} class="panel px-4 py-3.5 grid gap-0.5">
              <p class="text-[12px] text-muted">${k}</p>
              <p class="text-[22px] font-bold tnum tracking-tight">${val}</p>
            </div>`)}
        </section>
        <section class="panel p-5 grid gap-4">
          <h2 class="font-bold text-[16px] flex items-center gap-2"><${I.Trophy} size=${17} /> 가장 많이 틀린 단어 Top 5</h2>
          ${top.length === 0 ? html`<p class="text-muted">다시 나온 단어 없이 모두 3초 안에 통과했어요.</p>` : html`
            <ol class="grid gap-3.5">
              ${top.map((id, i) => {
                const w = L.BY_ID[id];
                return html`
                  <li key=${id} class="grid items-center gap-3" style=${{ gridTemplateColumns: "20px 1fr auto auto" }}>
                    <span class="text-[13px] text-muted tnum">${i + 1}</span>
                    <div class="min-w-0">
                      <div class="flex items-baseline gap-2 flex-wrap">
                        <span class="font-semibold text-[18px]" style=${{ fontFamily: "var(--f-word)" }} lang="en">${w.word}</span>
                        <span class="text-[13.5px] text-muted">${w.meaning}</span>
                      </div>
                      <div class="bar mt-1.5" style=${{ height: "4px" }}><span style=${{ transform: `scaleX(${s.err[id] / max})`, background: "var(--again)" }}></span></div>
                    </div>
                    <span class="tag tag-again tnum">오답 ${s.err[id]}</span>
                    <button type="button" class=${"speak" + (speakingId === id ? " is-on" : "")} style=${{ position: "relative", left: "auto", bottom: "auto", width: "38px", height: "38px" }}
                      disabled=${!TTS.ok} aria-label=${`${w.word} 발음 듣기`} onClick=${() => speak(id, w.word)}><${I.Volume2} size=${17} /></button>
                  </li>`;
              })}
            </ol>`}
        </section>
        <div class="grid sm:grid-cols-2 gap-2">
          <button type="button" class="btn-primary" onClick=${onClose}>대시보드로</button>
          <button type="button" class="btn-ghost" style=${{ minHeight: "52px" }} disabled=${!canAgain} onClick=${onAgain}>
            <${I.RotateCcw} size=${17} /> ${canAgain ? again : "남은 새 단어가 부족해요"}
          </button>
        </div>
      </div>`;
  }

  /* ---------- 대시보드 ---------- */
  function StatPanel({ c }) {
    const pct = c.total ? c.learned / c.total : 0;
    return html`
      <div class="panel p-6 grid gap-5 relative overflow-hidden">
        <div class="absolute right-3 top-2 bob" aria-hidden="true"><${Mascot} pose="great" size=${92} /></div>
        <div class="grid gap-1">
          <p class="text-[13px] text-muted font-medium">외운 단어</p>
          <p class="flex items-baseline gap-2"><span class="stat-num tnum">${c.learned}</span><span class="text-muted tnum">/ ${c.total}</span></p>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax=${c.total} aria-valuenow=${c.learned} aria-label="외운 단어 비율">
          <span style=${{ transform: `scaleX(${pct})` }}></span>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-2xl px-3.5 py-3" style=${{ background: "var(--surface-2)" }}>
            <p class="text-[12px] text-muted">남은 새 단어</p><p class="text-[18px] font-bold tnum">${c.unlearned}</p>
          </div>
          <div class="rounded-2xl px-3.5 py-3" style=${{ background: "var(--surface-2)" }}>
            <p class="text-[12px] text-muted">${c.inProgress ? "공부 중" : "복습 가능"}</p><p class="text-[18px] font-bold tnum">${c.inProgress || c.learned}</p>
          </div>
        </div>
      </div>`;
  }

  function ModeCard({ n, mode, c, onStart }) {
    const disabled = mode === "learn" && c.unlearned < n;
    const flow = mode === "learn" ? L.flowOf(n) : [`4지선다 ${n}문항`, "3초 안에 맞힐 때까지 반복", "첫 시도 정답률 측정"];
    const go = () => { if (!disabled) onStart(mode, mode === "learn" ? "new" : "quiz", n); };
    return html`
      <button type="button" class="mode" aria-disabled=${disabled} onClick=${go}
        aria-label=${`${mode === "learn" ? "단어 암기" : "객관식 퀴즈"} ${n}${mode === "learn" ? "개" : "문항"} ${disabled ? "(새 단어 부족)" : "시작"}`}>
        <div class="flex items-baseline justify-between gap-3">
          <span class="mode-num tnum">${n}</span>
          <span class="mode-unit">${mode === "learn" ? "단어" : "문항"}</span>
        </div>
        <ol class="flow">${flow.map((f, i) => html`<li key=${i}>${f}</li>`)}</ol>
        <span class="mode-cta">${disabled ? `새 단어 ${c.unlearned}개 남음` : "시작하기"}${!disabled && html`<${I.ArrowRight} size=${16} />`}</span>
      </button>`;
  }

  function ModeSection({ title, desc, Icon, mode, c, onStart }) {
    return html`
      <section class="grid gap-4">
        <div class="grid gap-1">
          <h2 class="section-title"><span class="section-icon"><${Icon} size=${16} /></span>${title}</h2>
          <p class="text-[14px] text-muted">${desc}</p>
        </div>
        <div class="grid gap-3 sm:grid-cols-3">
          ${[20, 40, 80].map(n => html`<${ModeCard} key=${n} n=${n} mode=${mode} c=${c} onStart=${onStart} />`)}
        </div>
      </section>`;
  }

  function ResumeBanner({ s, onResume, onAbandon }) {
    const label = s.mode === "quiz" ? "객관식 퀴즈" : s.source === "review" ? "전에꺼 외우기" : "단어 암기";
    const p = s.phases[s.phaseIdx];
    const where = s.finalized ? "결과를 아직 확인하지 않았어요" : `${p.name} · 통과 ${s.setIds.length - s.queue.length}/${s.setIds.length}`;
    return html`
      <section class="resume" aria-label="진행 중인 학습">
        <div class="flex items-center gap-3 min-w-0">
          <span class="resume-icon"><${I.Play} size=${16} /></span>
          <div class="min-w-0">
            <p class="font-semibold truncate">${label} ${s.size}${s.mode === "quiz" ? "문항" : "개"} 진행 중</p>
            <p class="text-[13px] text-ink-2 truncate">${where}</p>
          </div>
        </div>
        <div class="flex gap-2 flex-none">
          ${!s.finalized && html`<button type="button" class="btn-ghost" onClick=${onAbandon}>그만두기</button>`}
          <button type="button" class="btn-primary" style=${{ minHeight: "44px" }} onClick=${onResume}>${s.finalized ? "결과 보기" : "이어서 하기"}</button>
        </div>
      </section>`;
  }

  function Dashboard({ store, onStart, onResume, onSheet }) {
    const c = L.counts(store);
    const s = store.session;
    return html`
      <${Fragment}>
        <div class="max-w-[1040px] mx-auto pt-6 pb-36 grid gap-11">
          <header class="flex items-center justify-between gap-3 flex-wrap">
            <div class="flex items-center gap-2.5">
              <span class="logo" aria-hidden="true">V</span>
              <div class="leading-tight">
                <p class="text-[15px] font-semibold tracking-tight">Vocabulary 22000</p>
                <p class="text-[12px] text-muted">적응형 단어 암기</p>
              </div>
            </div>
            <span class="chip-quiet">${Storage.ok ? "기록은 이 브라우저에 저장돼요" : "이 창에서는 기록이 저장되지 않아요"}</span>
          </header>

          <section class="grid gap-8 md:grid-cols-[1.25fr_1fr] items-center">
            <div class="grid gap-4">
              <p class="eyebrow">오늘의 학습</p>
              <h1 class="display">오늘은 몇 개를<br />외워볼까요?</h1>
              <p class="lead">스스로 채점할 필요 없어요. 뜻을 고르기까지 걸린 시간으로 얼마나 아는지 판단해서, 늦게 맞히거나 틀린 단어를 몇 장 뒤에 다시 보여 줍니다.</p>
              <div class="flex flex-wrap gap-2">
                <span class="legend"><i class="dot" style=${{ background: "var(--brand)" }}></i>3초 이내 · 통과</span>
                <span class="legend"><i class="dot" style=${{ background: "var(--hard)" }}></i>6초 이내 · 6~7장 뒤</span>
                <span class="legend"><i class="dot" style=${{ background: "var(--again)" }}></i>6초 초과·오답 · 3~4장 뒤</span>
              </div>
            </div>
            <${StatPanel} c=${c} />
          </section>

          ${s && html`<${ResumeBanner} s=${s} onResume=${onResume} onAbandon=${() => onSheet({ type: "abandon" })} />`}

          <${ModeSection} title="단어 암기" mode="learn" Icon=${I.Layers} c=${c} onStart=${onStart}
            desc="처음 보는 단어는 익히기 카드로 먼저 보고, 묶음별로 외운 뒤 많이 틀린 단어만 모아 최종 테스트까지 갑니다." />
          <${ModeSection} title="객관식 퀴즈" mode="quiz" Icon=${I.ListChecks} c=${c} onStart=${onStart}
            desc="4지선다 실전 테스트예요. 외운 단어부터 출제하고, 모두 3초 안에 맞힐 때까지 이어집니다." />

          <footer class="flex flex-wrap justify-end gap-4 text-[12.5px]">
            <button type="button" class="link-quiet" onClick=${() => onSheet({ type: "reset" })}>학습 기록 초기화</button>
          </footer>
        </div>

        <button type="button" class="review-fab" onClick=${() => onSheet({ type: "review" })} aria-label=${`전에꺼 외우기, 외운 단어 ${c.learned}개`}>
          <span class="ic"><${I.History} size=${18} /></span>
          <span class="grid leading-tight">
            <span class="text-[14px] font-semibold">전에꺼 외우기</span>
            <span class="text-[11.5px] text-muted">외운 단어 복습</span>
          </span>
          <span class="badge tnum">${c.learned}</span>
        </button>
      <//>`;
  }

  /* ---------- 시트(확인 창) ---------- */
  function Sheet({ title, onClose, children }) {
    const ref = useRef(null);
    useEffect(() => {
      const k = e => { if (e.key === "Escape") onClose(); };
      window.addEventListener("keydown", k);
      const f = ref.current && (ref.current.querySelector("[data-autofocus]") || ref.current.querySelector("button"));
      if (f) f.focus({ preventScroll: true });
      return () => window.removeEventListener("keydown", k);
    }, []);
    useLayoutEffect(() => {
      if (RM || !ref.current) return;
      animateSpring(ref.current, v => ({ transform: `translateY(${(1 - v) * 36}px) scale(${0.97 + 0.03 * v})`, opacity: Math.min(1, v * 1.6) }), { from: 0, to: 1, stiffness: 320, damping: 28 });
    }, []);
    return html`
      <div class="sheet-wrap" role="dialog" aria-modal="true" aria-label=${title}>
        <div class="scrim" onClick=${onClose}></div>
        <div ref=${ref} class="sheet">
          <div class="flex items-start justify-between gap-3">
            <h3 class="text-[19px] font-bold tracking-tight">${title}</h3>
            <button type="button" class="icon-btn" style=${{ width: "34px", height: "34px", marginTop: "-4px", marginRight: "-6px" }} aria-label="닫기" onClick=${onClose}><${I.X} size=${16} /></button>
          </div>
          ${children}
        </div>
      </div>`;
  }

  function SheetBody({ sheet, store, close, dispatch, startNow, setView }) {
    const c = L.counts(store);
    const s = store.session;
    if (sheet.type === "review") {
      const N = c.learned;
      const sizes = [20, 40, 80].filter(n => n < N);
      if (N > 0 && !sizes.includes(N) && N <= 80) sizes.push(N);
      const opts = N > 80 ? [20, 40, 80] : sizes;
      return html`
        <${Sheet} title="전에꺼 외우기" onClose=${close}>
          ${N === 0 ? html`
            <p class="text-ink-2">아직 외운 단어가 없어요. [단어 암기]에서 한 세트를 최종 테스트까지 마치면 여기에 쌓입니다.</p>
            <button type="button" class="btn-primary" data-autofocus onClick=${close}>확인</button>` : html`
            <p class="text-ink-2">외운 단어 ${N}개 중에서 많이 틀렸던 단어, 오래전에 외운 단어부터 다시 외워요. 익히기 카드 없이 바로 시간을 잽니다.</p>
            <div class="grid gap-2">
              ${opts.map((n, i) => html`
                <button key=${n} type="button" class="opt" data-autofocus=${i === 0 ? "" : undefined} onClick=${() => { close(); startNow("learn", "review", n); }}>
                  <span class="grid leading-tight"><span class="font-semibold">${n === N && ![20, 40, 80].includes(n) ? `전체 ${n}개` : `${n}개`}</span>
                  <span class="text-[12.5px] text-muted">${L.flowOf(n).join(" → ")}</span></span>
                  <${I.ArrowRight} size=${16} />
                </button>`)}
            </div>`}
        <//>`;
    }
    if (sheet.type === "replace") {
      const { mode, source, size } = sheet.payload;
      return html`
        <${Sheet} title="진행 중인 학습이 있어요" onClose=${close}>
          <p class="text-ink-2">한 번에 하나의 학습만 진행할 수 있어요. 지금 학습을 그만두고 새로 시작할까요?${s && s.source === "new" && !s.finalized ? ` 그만두면 이번 세션의 단어 ${s.size}개는 다시 새 단어로 돌아가요.` : ""}</p>
          <div class="grid gap-2">
            <button type="button" class="btn-primary" data-autofocus onClick=${() => { close(); setView("study"); }}>하던 학습 이어서 하기</button>
            <button type="button" class="btn-ghost btn-danger" onClick=${() => { close(); dispatch({ type: s && s.finalized ? "CLOSE" : "ABANDON" }); startNow(mode, source, size, true); }}>그만두고 새로 시작</button>
          </div>
        <//>`;
    }
    if (sheet.type === "abandon") {
      return html`
        <${Sheet} title="이번 학습을 그만둘까요?" onClose=${close}>
          <p class="text-ink-2">${s && s.source === "new" ? `이번 세션의 단어 ${s.size}개는 다시 새 단어로 돌아가요. 지금까지 쌓인 오답 기록은 남습니다.` : "지금까지 쌓인 오답 기록은 남고, 외운 단어 목록은 그대로예요."}</p>
          <div class="grid gap-2">
            <button type="button" class="btn-primary" data-autofocus onClick=${close}>계속하기</button>
            <button type="button" class="btn-ghost btn-danger" onClick=${() => { close(); dispatch({ type: "ABANDON" }); }}>그만두기</button>
          </div>
        <//>`;
    }
    if (sheet.type === "reset") {
      return html`
        <${Sheet} title="학습 기록을 모두 지울까요?" onClose=${close}>
          <p class="text-ink-2">외운 단어 ${c.learned}개, 오답 기록, 진행 중인 학습이 이 브라우저에서 모두 사라져요. 되돌릴 수 없습니다.</p>
          <div class="grid gap-2">
            <button type="button" class="btn-primary" data-autofocus onClick=${close}>취소</button>
            <button type="button" class="btn-ghost btn-danger" onClick=${() => { close(); dispatch({ type: "RESET" }); }}><${I.Trash2} size=${16} /> 모두 지우기</button>
          </div>
        <//>`;
    }
    return null;
  }

  /* ---------- 앱 ---------- */
  function App() {
    const [store, rawDispatch] = useReducer((st, a) => L.reduce(st, a), null, () => L.normalizeStore(Storage.load()));
    const dispatch = useCallback(a => rawDispatch({ ...a, now: Date.now() }), []);
    const [view, setView] = useState("home");
    const [sheet, setSheet] = useState(null);
    const [speaking, setSpeaking] = useState(null);
    const tok = useRef(0);
    const s = store.session;

    useEffect(() => { Storage.save(store); }, [store]);
    useEffect(() => { if (!s && view === "study") setView("home"); }, [s, view]);
    useEffect(() => { window.scrollTo(0, 0); }, [view, s && s.stage, s && s.phaseIdx]);

    const speak = useCallback((id, word) => {
      const t = ++tok.current;
      setSpeaking({ id, t });
      const ok = TTS.speak(word, () => setSpeaking(cur => (cur && cur.t === t ? null : cur)));
      if (!ok) setSpeaking(null);
    }, []);

    const startNow = (mode, source, size, force) => {
      if (s && !force) { setSheet({ type: "replace", payload: { mode, source, size } }); return; }
      dispatch({ type: "START", mode, source, size });
      setView("study");
    };
    const close = () => setSheet(null);
    const speakingId = speaking ? speaking.id : null;

    let body;
    if (view === "study" && s) {
      body = s.stage === "result"
        ? html`<${Result} s=${s} store=${store} speakingId=${speakingId} speak=${speak}
            onClose=${() => { dispatch({ type: "CLOSE" }); setView("home"); }}
            onAgain=${() => { const { mode, source, size } = s; dispatch({ type: "CLOSE" }); dispatch({ type: "START", mode, source, size }); }} />`
        : html`<${Study} s=${s} dispatch=${dispatch} speakingId=${speakingId} speak=${speak} active=${!sheet} goHome=${() => setView("home")} />`;
    } else {
      body = html`<${Dashboard} store=${store} onStart=${startNow} onResume=${() => setView("study")} onSheet=${setSheet} />`;
    }
    return html`
      <${Fragment}>
        ${body}
        ${sheet && html`<${SheetBody} sheet=${sheet} store=${store} close=${close} dispatch=${dispatch} startNow=${startNow} setView=${setView} />`}
      <//>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>

</body></html>
